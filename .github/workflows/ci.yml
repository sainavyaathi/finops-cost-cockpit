name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install
        run: pip install -r app/requirements.txt pytest pyyaml
      - name: Engine and app tests
        env:
          PYTHONPATH: src
        run: pytest -q tests app/tests
